services:
  - type: web
    name: boutique-central-saas-api
    runtime: docker
    plan: starter
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_PUBLIC_URL
        sync: false # Set to your live Render public URL, e.g. https://boutique-central-api.onrender.com
      - key: DATABASE_URL
        sync: false # Set to your managed PostgreSQL connection string (Supabase / Neon / Render)
      - key: JWT_SECRET
        sync: false
      - key: SUPER_ADMIN_EMAIL
        value: admin@ecomplatform.com
      - key: AWS_REGION
        value: ap-south-2
      - key: AWS_BUCKET_NAME
        value: boutique-media-848910045051-hyd
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
