 Master 20-Phase Implementation Roadmap

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 1: Project Scaffolding & Monorepo Architecture

 - What it does: Sets up the foundational workspace structure containing the backend API, the client SDK package, and  
   the Super Admin frontend application with TypeScript, linting, and environment configurations.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 2: PostgreSQL Database Schema & Multi-Tenant Models

 - What it does: Designs and deploys the database schema (using Prisma/Drizzle ORM) for clients, subscription_plans,   
   client_subscriptions, client_media, and subscription_invoices with multi-tenant data isolation.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 3: Multi-Tenant Authentication & Domain Security Middleware

 - What it does: Implements JWT authentication for the Super Admin and public/secret API key verification for clients. 
   Enforces domain whitelisting to prevent unauthorized domain usage of ClientIDs.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 4: Subscription Status & Lifecycle Engine

 - What it does: Builds the central status verification API (GET /api/v1/client/status) that checks whether a website  
   is ACTIVE, GRACE_PERIOD, or SUSPENDED in <20ms with Edge caching.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 5: Automated Expiry Cron Worker & Grace Period Logic

 - What it does: Creates an automated background worker that runs every midnight to check expiring subscriptions,      
   transition unpaid accounts into a 3-day grace period, and suspend accounts when grace expires.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 6: Cloudflare R2 / S3 Presigned Storage & Quota Service

 - What it does: Builds backend endpoints for secure photo uploads (POST /api/v1/storage/request-upload). Checks image 
   count (e.g. max 30) and storage size (e.g. 1.2 GB) before issuing presigned cloud URLs.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 7: Razorpay Payment & Webhook Auto-Unlock Engine

 - What it does: Integrates Razorpay / UPI payment orders and builds the webhook listener (POST
   /api/v1/webhooks/razorpay). On successful payment, it extends the subscription by +30 days and auto-reactivates     
   suspended sites.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 8: SDK Core Architecture & CDN Build Pipeline

 - What it does: Sets up the Rollup/esbuild bundling pipeline to compile the TypeScript SDK into a single, ultra-fast  
   minified file (boutique-sdk.min.js, <20KB) distributed via CDN.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 9: SDK Gatekeeper & Suspension Lock Screen Module

 - What it does: Builds the public gatekeeper engine inside the SDK. It mounts a floating renewal banner during grace  
   periods, and completely locks/blurs suspended websites with a modern "Pay Renewal (UPI / Card)" screen.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 10: SDK Quota Enforcer & Client-Side WebP Compressor

 - What it does: Implements automatic in-browser WebP image resizing (<400KB) before upload and blocks any attempt to  
   upload more photos than allowed by the plan, displaying an upgrade prompt.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 11: SDK Dynamic CMS & Gallery Loader Module

 - What it does: Implements boutique.gallery.mount('#container') so static websites fetch and render collection photos 
   and prices dynamically via API, ensuring the site cannot function if the script is removed.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 12: SDK WhatsApp Ordering Bridge Engine

 - What it does: Automatically binds to boutique product cards to generate pre-filled WhatsApp click-to-chat order     
   links containing the product name, code, price, and image URL.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 13: SDK Self-Serve Billing Modal Integration

 - What it does: Embeds the Razorpay checkout modal directly into the SDK so boutique owners can pay renewals or       
   upgrade plans without leaving their website.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 14: Drop-in Client Admin (/admin) SDK Module

 - What it does: Builds the embeddable admin panel interface containing the photo uploader, live quota progress bars   
   (28/30 Photos Used), store details editor, and "Pay Next Month" billing tab.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 15: Super Admin Dashboard Scaffold & Authentication UI

 - What it does: Builds the frontend dashboard for you (the agency owner) using Next.js / Tailwind CSS with secure     
   login and a mobile-friendly layout.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 16: Super Admin Client Onboarding & Plan Configurator

 - What it does: Builds the interface to create new boutique clients, assign custom domains, configure plans (Starter, 
   Growth, Pro), and generate credentials.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 17: Super Admin AI Agent Prompt Generator (Mandates Hub)

 - What it does: Builds the core AI Prompt Generator that automatically outputs a complete, customized prompt
   containing all mandates, ClientID, script tags, and checklist for you to paste into your AI website builder.        

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 18: Master Killswitch, Manual Overrides & Analytics

 - What it does: Adds one-click buttons in Super Admin for Force Suspend, Extend 7 Days Grace, and Reactivate, along   
   with Monthly Recurring Revenue (MRR) and storage analytics.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 19: Automated WhatsApp Payment Notification Queue

 - What it does: Connects WhatsApp Business API (Interakt / Wati) to send automated renewal alerts to clients at T-5   
   days, T-1 day, Grace Period, and Suspension.

 ────────────────────────────────────────────────────────────────────────────────

 ### Phase 20: Comprehensive End-to-End QA, Testing & Production Deployment

 - What it does: Executes all 7 test cases (Active, Grace, Suspended, Quota limit, Webhook auto-unlock, Anti-tamper),  
   configures SSL and CDN distribution, and finalizes production deployment.
